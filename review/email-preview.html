>\u003ctd align=\"center\" style=\"padding:0 24px 30px;\">\u003ctable role=\"presentation\" width=\"100%\" style=\"width:100%;max-width:520px;\">\u003ctr>\u003ctd align=\"center\" bgcolor=\"#702b4a\" style=\"border-radius:10px;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=en&amp;utm_source=brevo&amp;utm_medium=email&amp;utm_campaign=october_rose_2026&amp;utm_content=launch_en\" style=\"display:block;padding:16px 20px;border:2px solid #702b4a;border-radius:10px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;line-height:1.4;text-align:center;\">Browse artisan soaps →\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:28px 40px 4px;font-size:16px;line-height:1.7;\">\u003cp style=\"margin:0 0 18px;\">Hi everyone,\u003c/p>\u003cp style=\"margin:0 0 18px;\">For October, I’m offering any two of my handmade soaps for $14, and I’ll donate $1 to Ruban Rose for every two soaps sold.\u003c/p>\u003cp style=\"margin:0 0 18px;\">Pick your favourite scents—the offer applies automatically in your cart.\u003c/p>\u003cp style=\"margin:0 0 18px;\">Breast cancer has become part of my journey, but I won’t let it define me. This October, I’m giving back through the soaps I make with care.\u003c/p>\u003cp style=\"margin:0 0 18px;\">Thank you for supporting handmade products and helping me give back to a cause close to my heart.\u003c/p>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 24px;\">\u003cimg src=\"https://justbnatural.ca/images/october/slide-1.webp\" width=\"520\" alt=\"Handmade soaps arranged in the shape of a pink breast cancer awareness ribbon.\" style=\"display:block;width:100%;height:auto;border-radius:8px;\">\u003cp style=\"font-size:13px;line-height:1.8;color:#555b53;\">Handcrafted in small batches with organic olive oil, organic coconut oil, unrefined shea butter and castor oil. Discover the scents and full ingredient details on our website.\u003c/p>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 24px;\">\u003cdiv style=\"background:#f6e9ed;padding:22px;border-radius:8px;\">\u003ch2 style=\"font-family:Georgia,serif;font-size:24px;font-weight:normal;margin:0 0 14px;color:#805567;\">Breast Cancer Awareness Month\u003c/h2>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 12px;\">About 1 in 8 women in Canada will develop breast cancer during their lifetime. Taking a moment to learn about screening can help you decide what to discuss with your doctor.\u003c/p>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 12px;\">In Quebec, the screening program is for women aged 50–74 covered by public health insurance, with mammograms every two years. Under 50 or over 74, speak with your doctor about screening based on your personal risk. After a breast cancer diagnosis, follow-up is personalized.\u003c/p>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 14px;\">You’ll find the awareness graphics and more helpful information on our October page. Feel free to share it with someone you love.\u003c/p>\u003cp style=\"font-size:13px;line-height:1.9;margin:0;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=en#awareness-title\" style=\"color:#805567;\">Our October awareness page →\u003c/a>\u003cbr>\u003ca href=\"https://www.quebec.ca/sante/conseils-et-prevention/depistage-et-offre-de-tests-de-porteur/programme-quebecois-de-depistage-du-cancer-du-sein\" style=\"color:#805567;\">Quebec’s screening information →\u003c/a>\u003cbr>\u003ca href=\"https://cancer.ca/en/cancer-information/cancer-types/breast/statistics\" style=\"color:#805567;\">Canadian Cancer Society: learn more →\u003c/a>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 20px;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=en#awareness-title\">\u003cimg src=\"https://justbnatural.ca/images/october/slide-2.webp\" width=\"520\" alt=\"Breast cancer awareness graphic — readable guidance in this email.\" style=\"display:block;width:100%;height:auto;border-radius:8px;\">\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 20px;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=en#awareness-title\">\u003cimg src=\"https://justbnatural.ca/images/october/slide-3.webp\" width=\"520\" alt=\"Breast cancer awareness graphic — readable guidance in this email.\" style=\"display:block;width:100%;height:auto;border-radius:8px;\">\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 20px;font-size:11px;line-height:1.7;color:#555b53;\">Awareness graphics shared on Instagram. Current guidance and source links are included above.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd align=\"center\" style=\"padding:0 24px 30px;\">\u003ctable role=\"presentation\" width=\"100%\" style=\"width:100%;max-width:520px;\">\u003ctr>\u003ctd align=\"center\" bgcolor=\"#702b4a\" style=\"border-radius:10px;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=en&amp;utm_source=brevo&amp;utm_medium=email&amp;utm_campaign=october_rose_2026&amp;utm_content=launch_en\" style=\"display:block;padding:16px 20px;border:2px solid #702b4a;border-radius:10px;color:#ffffff;text-decoration:none;font-size:16px;font-weight:bold;line-height:1.4;text-align:center;\">Browse artisan soaps →\u003c/a>\u003c/td>\u003c/tr>\u003c/table>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 28px;font-size:12px;line-height:1.6;color:#555b53;\">Available through October 31. The offer applies automatically to artisan soaps in your cart.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" align=\"center\" style=\"border-top:1px solid #d5d9cc;background:#ebeee5;padding:24px 40px;font-size:12px;line-height:1.7;color:#4d584e;\">\u003cp style=\"margin:0 0 8px;\">Just B Naturals\u003cbr>[ADD BUSINESS MAILING ADDRESS BEFORE SENDING]\u003cbr>\u003ca href=\"https://justbnatura =\"margin:0 0 18px;\">Bonjour à tous,\u003c/p>\u003cp style=\"margin:0 0 18px;\">En octobre, je vous offre deux savons faits à la main pour 14 $, et je verserai 1 $ au Ruban Rose pour chaque duo de savons vendu.\u003c/p>\u003cp style=\"margin:0 0 18px;\">Choisissez vos parfums préférés : la promotion s’applique automatiquement dans votre panier.\u003c/p>\u003cp style=\"margin:0 0 18px;\">Le cancer du sein fait désormais partie de mon parcours, mais je ne le laisserai pas me définir. En octobre, les savons que je fabrique avec soin me permettent de redonner.\u003c/p>\u003cp style=\"margin:0 0 18px;\">Merci de soutenir les produits faits à la main et de m’aider à redonner à une cause qui me tient à cœur.\u003c/p>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 24px;\">\u003cimg src=\"https://justbnatural.ca/images/october/slide-1.webp\" width=\"520\" alt=\"Savons artisanaux disposés en forme de ruban rose de sensibilisation au cancer du sein.\" style=\"display:block;width:100%;height:auto;border-radius:8px;\">\u003cp style=\"font-size:13px;line-height:1.8;color:#555b53;\">Fabriqués en petites quantités avec de l’huile d’olive biologique, de l’huile de coco biologique, du beurre de karité non raffiné et de l’huile de ricin. Retrouvez les parfums et les ingrédients complets sur notre site.\u003c/p>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 24px;\">\u003cdiv style=\"background:#f6e9ed;padding:22px;border-radius:8px;\">\u003ch2 style=\"font-family:Georgia,serif;font-size:24px;font-weight:normal;margin:0 0 14px;color:#805567;\">Mois de la sensibilisation au cancer du sein\u003c/h2>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 12px;\">Environ 1 femme sur 8 au Canada développera un cancer du sein au cours de sa vie. S’informer sur le dépistage aide à préparer une discussion avec son médecin.\u003c/p>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 12px;\">Au Québec, le programme s’adresse aux femmes de 50 à 74 ans assurées par le régime public, avec une mammographie tous les deux ans. Avant 50 ans ou après 74 ans, discutez du dépistage avec votre médecin selon votre risque personnel. Après un cancer du sein, le suivi est personnalisé.\u003c/p>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 14px;\">Notre page d’octobre regroupe les affiches de sensibilisation et d’autres liens utiles. N’hésitez pas à la partager avec une personne que vous aimez.\u003c/p>\u003cp style=\"font-size:13px;line-height:1.9;margin:0;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=fr#awareness-title\" style=\"color:#805567;\">Notre page de sensibilisation d’octobre →\u003c/a>\u003cbr>\u003ca href=\"https://www.quebec.ca/sante/conseils-et-prevention/depistage-et-offre-de-tests-de-porteur/programme-quebecois-de-depistage-du-cancer-du-sein\" style=\"color:#805567;\">Information sur le dépistage au Québec →\u003c/a>\u003cbr>\u003ca href=\"https://cancer.ca/en/cancer-information/cancer-types/breast/statistics\" style=\"color:#805567;\">Société canadienne du cancer : en savoir plus →\u003c/a>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 20px;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=fr#awareness-title\">\u003cimg src=\"https://justbnatural.ca/images/october/slide-4.webp\" width=\"520\" alt=\"Affiche de sensibilisation — texte et conseils actuels dans le courriel.\" style=\"display:block;width:100%;height:auto;border-radius:8px;\">\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 20px;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=fr#awareness-title\">\u003cimg src=\"https://justbnatural.ca/images/october/slide-5.webp\" width=\"520\" alt=\"Affiche de sensibilisation — texte et conseils actuels dans le courriel.\" style=\"display:block;width:100%;height:auto;border-radius:8px;\">\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"pad\" \" width=\"520\" alt=\"Handmade soaps arranged in the shape of a pink breast cancer awareness ribbon.\" style=\"display:block;width:100%;height:auto;border-radius:8px;\">\u003cp style=\"font-size:13px;line-height:1.8;color:#555b53;\">Handcrafted in small batches with organic olive oil, organic coconut oil, unrefined shea butter and castor oil. Discover the scents and full ingredient details on our website.\u003c/p>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 24px;\">\u003cdiv style=\"background:#f6e9ed;padding:22px;border-radius:8px;\">\u003ch2 style=\"font-family:Georgia,serif;font-size:24px;font-weight:normal;margin:0 0 14px;color:#805567;\">Breast Cancer Awareness Month\u003c/h2>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 12px;\">About 1 in 8 women in Canada will develop breast cancer during their lifetime. Taking a moment to learn about screening can help you decide what to discuss with your doctor.\u003c/p>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 12px;\">In Quebec, the screening program is for women aged 50–74 covered by public health insurance, with mammograms every two years. Under 50 or over 74, speak with your doctor about screening based on your personal risk. After a breast cancer diagnosis, follow-up is personalized.\u003c/p>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 14px;\">You’ll find the awareness graphics and more helpful information on our October page. Feel free to share it with someone you love.\u003c/p>\u003cp style=\"font-size:13px;line-height:1.9;margin:0;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=en#awareness-title\" style=\"color:#805567;\">Our October awareness page →\u003c/a>\u003cbr>\u003ca href=\"https://www.quebec.ca/sante/conseils-et-prevention/depistage-et-offre-de-tests-de-porteur/programme-quebecois-de-depistage-du-cancer-du-sein\" style=\"color:#805567;\">Quebec’s screening information →\u003c/a>\u003cbr>\u003ca href=\"https://cancer. ur le dépistage aide à préparer une discussion avec son médecin.\u003c/p>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 12px;\">Au Québec, le programme s’adresse aux femmes de 50 à 74 ans assurées par le régime public, avec une mammographie tous les deux ans. Avant 50 ans ou après 74 ans, discutez du dépistage avec votre médecin selon votre risque personnel. Après un cancer du sein, le suivi est personnalisé.\u003c/p>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 14px;\">Notre page d’octobre regroupe les affiches de sensibilisation et d’autres liens utiles. N’hésitez pas à la partager avec une personne que vous aimez.\u003c/p>\u003cp style=\"font-size:13px;line-height:1.9;margin:0;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=fr#awareness-title\" style=\"color:#805567;\">Notre page de sensibilisation d’octobre →\u003c/a>\u003cbr>\u003ca href=\"https://www.quebec.ca/sante/conseils-et-prevention/depistage-et-offre-de-tests-de-porteur/programme-quebecois-de-depistage-du-cancer-du-sein\" style=\"color:#805567;\">Information sur le dépistage au Québec →\u003c/a>\u003cbr>\u003ca href=\"https://cancer.ca/en/cancer-information/cancer-types/breast/statistics\" style=\"color:#805567;\">Société canadienne du cancer : en savoir plus →\u003c/a>\u003c/p>\u003c/div>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 20px;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=fr#awareness-title\">\u003cimg src=\"https://justbnatural.ca/images/october/slide-4.webp\" width=\"520\" alt=\"Affiche de sensibilisation — texte et conseils actuels dans le courriel.\" style=\"display:block;width:100%;height:auto;border-radius:8px;\">\u003c/a>\u003c/td>\u003c/tr>\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 20px;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=fr#awareness-title\">\u003cimg src=\"https://justbnatural.ca/images/october/slide-5.webp\" width=\"520\" alt=\"Affiche de sensibilisati rds and support this month.\u003c/p>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 24px;\">\u003cimg src=\"https://justbnatural.ca/images/october/slide-1.webp\" width=\"520\" alt=\"Handmade soaps arranged in the shape of a pink breast cancer awareness ribbon.\" style=\"display:block;width:100%;height:auto;border-radius:8px;\">\u003cp style=\"font-size:13px;line-height:1.8;color:#555b53;\">Handcrafted in small batches with organic olive oil, organic coconut oil, unrefined shea butter and castor oil. Discover the scents and full ingredient details on our website.\u003c/p>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd class=\"pad\" style=\"padding:0 40px 24px;\">\u003cdiv style=\"background:#f6e9ed;padding:22px;border-radius:8px;\">\u003ch2 style=\"font-family:Georgia,serif;font-size:24px;font-weight:normal;margin:0 0 14px;color:#805567;\">Breast Cancer Awareness Month\u003c/h2>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 12px;\">About 1 in 8 women in Canada will develop breast cancer during their lifetime. Taking a moment to learn about screening can help you decide what to discuss with your doctor.\u003c/p>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 12px;\">In Quebec, the screening program is for women aged 50–74 covered by public health insurance, with mammograms every two years. Under 50 or over 74, speak with your doctor about screening based on your personal risk. After a breast cancer diagnosis, follow-up is personalized.\u003c/p>\u003cp style=\"font-size:14px;line-height:1.8;margin:0 0 14px;\">You’ll find the awareness graphics and more helpful information on our October page. Feel free to share it with someone you love.\u003c/p>\u003cp style=\"font-size:13px;line-height:1.9;margin:0;\">\u003ca href=\"https://justbnatural.ca/october-rose.html?lang=en#awareness-title\" style=\"color:#805567;\">Our October awareness page →\u003c/a>\u003cbr>\u003ca href=\"https://www.quebec.ca/sante/conseils-et-prevention/depistage
