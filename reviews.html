<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Customer reviews | Just B Natural</title><link rel="stylesheet" href="styles.min.css?v=20261017-portal"><script type="module" src="reviews-admin.js?v=20261017-shopping"></script></head><body><main class="shell section" style="max-width:780px"><a href="inventory.html">← Inventory</a><h1>Customer reviews</h1><p>Add real customer feedback only with their permission. These appear as shop-wide testimonials, without invented ratings.</p><form data-review-login><label>Inventory password <input type="password" name="key" autocomplete="current-password" required></label> <button class="button button-dark">Open reviews</button></form><p data-review-status role="status"></p><section data-review-manager hidden><form data-review-form><label class="field-block">Customer display name<input name="author" maxlength="60" required></label><label class="field-block">English review<textarea name="quoteEn" maxlength="600" required></textarea></label><label class="field-block">French review (optional)<textarea name="quoteFr" maxlength="600"></textarea></label><label class="consent-check"><input type="checkbox" name="permission" required>The customer gave permission to publish their name and review.</label><label class="consent-check"><input type="checkbox" name="published">Publish on the shop now</label><button class="button button-dark">Save review</button></form><h2>Saved reviews</h2><div data-review-list></div><button type="button" class="button button-outline" data-review-lock>Lock reviews</button></section></main></body></html>
